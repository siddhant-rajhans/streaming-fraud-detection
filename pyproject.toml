[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "streaming-fraud-detection"
version = "0.1.0"
description = "Real-time fraud scoring with XGBoost on Spark Structured Streaming, plus Evidently drift monitoring and auto-retrain"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "pyspark>=3.5.0",
    "kafka-python>=2.0.2",
    "xgboost>=2.0.0",
    "evidently>=0.4.0",
    "pandas>=2.1.0",
    "numpy>=1.26.0",
    "scikit-learn>=1.3.0",
    "pydantic>=2.5.0",
    "click>=8.1.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
airflow = ["apache-airflow>=2.8.0"]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
]

[project.scripts]
fraud-detection = "fraud_detection.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
